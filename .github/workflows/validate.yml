name: Validate Holiday Feed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate holiday-dates.json
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib
          p=pathlib.Path("holiday-dates.json")
          d=json.loads(p.read_text())
          assert d["schemaVersion"] == 1
          assert isinstance(d["revision"], int) and d["revision"] >= 1
          assert isinstance(d["records"], list) and len(d["records"]) <= 2000
          allowed={"ramadan-begins","eid-al-fitr","eid-al-adha","diwali"}
          statuses={"authoritySupplied","sourceSupplied","provisional"}
          for r in d["records"]:
              assert r["ruleID"] in allowed
              datetime.date.fromisoformat(r["date"])
              if r.get("endDate"):
                  datetime.date.fromisoformat(r["endDate"])
              assert r["status"] in statuses
              assert r["sourceLabel"] and r["sourceURL"].startswith("https://")
          print("revision", d["revision"], "records", len(d["records"]))
          PY
